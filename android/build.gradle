group 'app.talsec.rasp.flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    ext.talsec_version = '20.0.1'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/plugin' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'app.talsec.plugin:talsec-security-plugin:1.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp' }
        maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/common' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'app.talsec.plugin'

android {
    if (project.android.hasProperty("namespace")) {
        namespace("app.talsec.rasp.flutter")
    }

    compileSdk 36

    talsec {
        sdkVersion = talsec_version
        platform = "Flutter"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
    }

    buildTypes {
        release {
            proguardFiles 'proguard-rules.pro'
        }
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
